set_join:
  name: Set join
  description: Send a digital, analog or serial value to one connected bridge. State changes only on feedback.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: crestron
    join_type:
      required: true
      selector:
        select:
          options: [digital, analog, serial]
    join:
      required: true
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    value:
      required: true
      example: 32768
      selector:
        object:
get_join:
  name: Get join
  description: Read cached feedback and connection status for one bridge. A missing value is null.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: crestron
    join_type:
      required: true
      selector:
        select:
          options: [digital, analog, serial]
    join:
      required: true
      selector:
        number:
          min: 1
          max: 4096
          mode: box
pulse_join:
  name: Pulse digital join
  description: Pulse a digital join on one bridge, then release it.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: crestron
    join:
      required: true
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    seconds:
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 5
          step: 0.01
          mode: box
request_update:
  name: Request join update
  description: Ask the connected processor to resend its feedback.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: crestron
